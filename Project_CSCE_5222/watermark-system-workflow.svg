<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2560" viewBox="0 0 1200 2560">
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1d2b22;font-size:17px;font-weight:500}.edge-label{font-size:16px;fill:#1d2b22}.node{fill:#ffffff;stroke:#266435;stroke-width:1.5}.decision{fill:#266435;stroke:#1c4b28;stroke-width:1.5}.decision + text{fill:#ffffff}.link{fill:none;stroke:#202d23;stroke-width:1.5}</style><marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#202d23"/></marker></defs>
<rect width="1200" height="2560" fill="#ffffff"/>
<g transform="scale(1 0.94)">
<rect class="node" x="525" y="25" width="150" height="55" rx="27"/>
<text x="600" y="59" text-anchor="middle" class=""><tspan x="600" dy="0">Start MATLAB app</tspan></text>
<path class="link" d="M600 80 V119" marker-end="url(#a)"/>
<path class="decision" d="M600 120 L725 220 L600 320 L475 220 Z"/>
<text x="600" y="226" text-anchor="middle" class=""><tspan x="600" dy="0">Choose a workflow</tspan></text>
<text x="325" y="321" text-anchor="middle" class="edge-label"><tspan x="325" dy="0">Create</tspan></text>
<path class="link" d="M510 290 Q310 333 300 350" marker-end="url(#a)"/>
<path class="link" d="M690 290 C825 350 900 390 900 520 V1749" marker-end="url(#a)"/>
<rect class="node" x="120" y="350" width="360" height="72"/>
<text x="300" y="380" text-anchor="middle" class=""><tspan x="300" dy="0">Load cover image and</tspan><tspan x="300" dy="24">watermark image</tspan></text>
<path class="link" d="M300 422 V470" marker-end="url(#a)"/>
<rect class="node" x="120" y="470" width="360" height="72"/>
<text x="300" y="500" text-anchor="middle" class=""><tspan x="300" dy="0">Validate images and prepare a</tspan><tspan x="300" dy="24">small grayscale watermark</tspan></text>
<path class="link" d="M300 542 V590" marker-end="url(#a)"/>
<rect class="node" x="120" y="590" width="360" height="72"/>
<text x="300" y="620" text-anchor="middle" class=""><tspan x="300" dy="0">Choose strength, watermark</tspan><tspan x="300" dy="24">size, and mode</tspan></text>
<path class="link" d="M300 662 V690" marker-end="url(#a)"/>
<path class="decision" d="M300 690 L425 790 L300 890 L175 790 Z"/>
<text x="300" y="796" text-anchor="middle" class=""><tspan x="300" dy="0">Enough cover capacity?</tspan></text>
<text x="300" y="922" text-anchor="middle" class="edge-label"><tspan x="300" dy="0">Yes</tspan></text>
<path class="link" d="M300 890 V930" marker-end="url(#a)"/>
<text x="500" y="724" text-anchor="middle" class="edge-label"><tspan x="500" dy="0">No</tspan></text>
<path class="link" d="M425 790 C575 720 545 660 480 626" marker-end="url(#a)"/>
<rect class="node" x="120" y="930" width="360" height="72"/>
<text x="300" y="960" text-anchor="middle" class=""><tspan x="300" dy="0">Split cover into 2×2 blocks and</tspan><tspan x="300" dy="24">apply Haar transform</tspan></text>
<path class="link" d="M300 1002 V1040" marker-end="url(#a)"/>
<rect class="node" x="120" y="1040" width="360" height="72"/>
<text x="300" y="1070" text-anchor="middle" class=""><tspan x="300" dy="0">Embed header and watermark bits</tspan><tspan x="300" dy="24">in detail coefficients</tspan></text>
<path class="link" d="M300 1112 V1150" marker-end="url(#a)"/>
<rect class="node" x="120" y="1150" width="360" height="72"/>
<text x="300" y="1192" text-anchor="middle" class=""><tspan x="300" dy="0">Apply inverse Haar transform</tspan></text>
<path class="link" d="M300 1222 V1260" marker-end="url(#a)"/>
<rect class="node" x="120" y="1260" width="360" height="72"/>
<text x="300" y="1290" text-anchor="middle" class=""><tspan x="300" dy="0">Extract immediately to verify</tspan><tspan x="300" dy="24">the result</tspan></text>
<path class="link" d="M300 1332 V1370" marker-end="url(#a)"/>
<rect class="node" x="120" y="1370" width="360" height="72"/>
<text x="300" y="1400" text-anchor="middle" class=""><tspan x="300" dy="0">Display original, prepared,</tspan><tspan x="300" dy="24">watermarked, and recovered images</tspan></text>
<path class="link" d="M300 1442 V1480" marker-end="url(#a)"/>
<rect class="node" x="120" y="1480" width="360" height="72"/>
<text x="300" y="1510" text-anchor="middle" class=""><tspan x="300" dy="0">Show quality and recovery</tspan><tspan x="300" dy="24">measurements</tspan></text>
<path class="link" d="M300 1552 V1560" marker-end="url(#a)"/>
<path class="decision" d="M300 1560 L425 1660 L300 1760 L175 1660 Z"/>
<text x="300" y="1654" text-anchor="middle" class=""><tspan x="300" dy="0">Run optional robustness</tspan><tspan x="300" dy="24">study?</tspan></text>
<text x="300" y="1784" text-anchor="middle" class="edge-label"><tspan x="300" dy="0">Yes</tspan></text>
<path class="link" d="M300 1760 V1790" marker-end="url(#a)"/>
<text x="88" y="1794" text-anchor="middle" class="edge-label"><tspan x="88" dy="0">No</tspan></text>
<path class="link" d="M175 1660 C72 1710 75 1890 120 2006" marker-end="url(#a)"/>
<rect class="node" x="120" y="1790" width="360" height="72"/>
<text x="300" y="1820" text-anchor="middle" class=""><tspan x="300" dy="0">Test PNG, JPEG, cropping, and</tspan><tspan x="300" dy="24">resizing</tspan></text>
<path class="link" d="M300 1862 V1900" marker-end="url(#a)"/>
<rect class="node" x="120" y="1900" width="360" height="72"/>
<text x="300" y="1942" text-anchor="middle" class=""><tspan x="300" dy="0">Display recovery results</tspan></text>
<path class="link" d="M300 1972 V2010" marker-end="url(#a)"/>
<rect class="node" x="120" y="2010" width="360" height="72"/>
<text x="300" y="2052" text-anchor="middle" class=""><tspan x="300" dy="0">Save watermarked PNG</tspan></text>
<path class="link" d="M300 2082 V2120" marker-end="url(#a)"/>
<rect class="node" x="120" y="2120" width="360" height="72"/>
<text x="300" y="2150" text-anchor="middle" class=""><tspan x="300" dy="0">Reopen PNG and verify its</tspan><tspan x="300" dy="24">pixels and watermark</tspan></text>
<path class="link" d="M300 2192 V2220" marker-end="url(#a)"/>
<path class="decision" d="M300 2220 L425 2320 L300 2420 L175 2320 Z"/>
<text x="300" y="2326" text-anchor="middle" class=""><tspan x="300" dy="0">Save recovered watermark?</tspan></text>
<rect class="node" x="720" y="1790" width="360" height="72"/>
<text x="900" y="1820" text-anchor="middle" class=""><tspan x="900" dy="0">Open a previously saved</tspan><tspan x="900" dy="24">watermarked PNG</tspan></text>
<path class="link" d="M900 1862 V1900" marker-end="url(#a)"/>
<rect class="node" x="720" y="1900" width="360" height="72"/>
<text x="900" y="1930" text-anchor="middle" class=""><tspan x="900" dy="0">Read and validate embedded</tspan><tspan x="900" dy="24">header</tspan></text>
<path class="link" d="M900 1972 V2010" marker-end="url(#a)"/>
<rect class="node" x="720" y="2010" width="360" height="72"/>
<text x="900" y="2040" text-anchor="middle" class=""><tspan x="900" dy="0">Recover watermark bits and</tspan><tspan x="900" dy="24">check checksum</tspan></text>
<path class="link" d="M900 2082 V2120" marker-end="url(#a)"/>
<rect class="node" x="720" y="2120" width="360" height="72"/>
<text x="900" y="2150" text-anchor="middle" class=""><tspan x="900" dy="0">Display recovered watermark</tspan><tspan x="900" dy="24">and verification status</tspan></text>
<path class="link" d="M900 2192 V2220" marker-end="url(#a)"/>
<path class="decision" d="M900 2220 L1025 2320 L900 2420 L775 2320 Z"/>
<text x="900" y="2326" text-anchor="middle" class=""><tspan x="900" dy="0">Save recovered watermark?</tspan></text>
<text x="440" y="2437" text-anchor="middle" class="edge-label"><tspan x="440" dy="0">Yes</tspan></text>
<path class="link" d="M400 2380 Q455 2430 515 2470" marker-end="url(#a)"/>
<text x="762" y="2437" text-anchor="middle" class="edge-label"><tspan x="762" dy="0">Yes</tspan></text>
<path class="link" d="M800 2380 Q745 2430 685 2470" marker-end="url(#a)"/>
<rect class="node" x="470" y="2470" width="260" height="72"/>
<text x="600" y="2500" text-anchor="middle" class=""><tspan x="600" dy="0">Save recovered watermark as</tspan><tspan x="600" dy="24">PNG</tspan></text>
<rect class="node" x="550" y="2620" width="100" height="54" rx="27"/>
<text x="600" y="2654" text-anchor="middle" class=""><tspan x="600" dy="0">Finish</tspan></text>
<text x="132" y="2460" text-anchor="middle" class="edge-label"><tspan x="132" dy="0">No</tspan></text>
<path class="link" d="M200 2380 C120 2460 120 2570 550 2647" marker-end="url(#a)"/>
<text x="1067" y="2460" text-anchor="middle" class="edge-label"><tspan x="1067" dy="0">No</tspan></text>
<path class="link" d="M1000 2380 C1080 2460 1080 2570 650 2647" marker-end="url(#a)"/>
<path class="link" d="M600 2542 V2620" marker-end="url(#a)"/>
</g>
</svg>
